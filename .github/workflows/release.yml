# The Release pipeline (#269, ADR-0018): push a v*.*.* tag → build and publish to
# ONE GitHub Release — the single stable channel serving both the marketing page's
# download buttons and electron-updater's feed. workflow_dispatch is the re-run
# escape hatch (run it ON the tag's ref from the Actions UI).
#
# Three jobs land assets on the same tagged Release:
#   `release`        macOS arm64 — signed + notarized DMG + ZIP + latest-mac.yml.
#   `release-linux`  Linux x64 — unsigned AppImage + .deb + latest-linux.yml. Runs
#                    after `release` so the Release exists before it appends (no
#                    create-race) and Linux never blocks on Apple credentials.
#   `release-win`    Windows x64 — unsigned NSIS installer + .blockmap +
#                    latest.yml. Runs after `release` for the same create-race
#                    reason as Linux (ADR-0029).
#
# The macOS Release is ALWAYS signed + notarized — an unsigned macOS Release would
# be Gatekeeper-blocked for every downloader and rejected by the updater, so the
# job fails loudly when secrets are missing instead of shipping one. Linux ships
# unsigned (the platform norm); its AppImage self-updates, the .deb defers to apt.
#
# Repository secrets (the Apple-ID notarization route — matches the user's
# prior notarized app; no App Store Connect API key involved):
#   CSC_LINK                     base64 .p12 export of the Developer ID Application cert
#   CSC_KEY_PASSWORD             the .p12 passphrase
#   APPLE_ID                     the Apple ID email
#   APPLE_APP_SPECIFIC_PASSWORD  app-specific password from account.apple.com
#   APPLE_TEAM_ID                the 10-char team id (37K9GJSVX9)
name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  # electron-builder uploads the Release assets with the workflow token.
  contents: write

jobs:
  release:
    name: Build, sign, notarize, publish (macOS arm64)
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The feed must never disagree with the binary: the tag IS the version.
      - name: Guard — tag matches apps/desktop package.json version
        if: github.ref_type == 'tag'
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          pkg_version="$(node -p "require('./apps/desktop/package.json').version")"
          if [[ "$tag_version" != "$pkg_version" ]]; then
            echo "Tag v$tag_version does not match apps/desktop/package.json version $pkg_version." >&2
            echo "Bump the version in a release commit, then re-tag." >&2
            exit 1
          fi

      - name: Guard — signing + notarization secrets present
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=()
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            [[ -n "${!name}" ]] || missing+=("$name")
          done
          if (( ${#missing[@]} > 0 )); then
            echo "Refusing to build an unsigned Release — missing secrets: ${missing[*]}" >&2
            exit 1
          fi

      - name: Build, sign, notarize, publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          # electron-builder notarizes with the Apple-ID credential triple when
          # these are present in the env — no API key file needed.
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: pnpm --dir apps/desktop run release

      - name: Gatekeeper assessment of the published app
        run: |
          spctl -a -vv "apps/desktop/dist/mac-arm64/Vibe Mistro.app"

  release-linux:
    name: Build, publish (Linux x64)
    runs-on: ubuntu-latest
    # Sequenced after macOS so the tagged Release already exists — the Linux job
    # appends its assets instead of racing to create the Release. No native build
    # step: @lydell/node-pty ships a prebuilt linux-x64 binary (pulled by this
    # job's `pnpm install --frozen-lockfile`), so packaging is pure electron-builder.
    needs: release
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Guard — tag matches apps/desktop package.json version
        if: github.ref_type == 'tag'
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          pkg_version="$(node -p "require('./apps/desktop/package.json').version")"
          if [[ "$tag_version" != "$pkg_version" ]]; then
            echo "Tag v$tag_version does not match apps/desktop/package.json version $pkg_version." >&2
            echo "Bump the version in a release commit, then re-tag." >&2
            exit 1
          fi

      - name: Build, publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm --dir apps/desktop run release:linux

  release-win:
    name: Build, publish (Windows x64)
    runs-on: windows-latest
    # Independent lane, NOT gated on `release`: electron-builder creates-or-appends
    # the tagged Release itself, and a repo without Apple credentials must not
    # kill the Windows lane when the macOS guard refuses an unsigned Release
    # (ADR-0029). Windows defaults `run` to PowerShell and these guards are bash,
    # so the job forces `shell: bash`.
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Guard — tag matches apps/desktop package.json version
        if: github.ref_type == 'tag'
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          pkg_version="$(node -p "require('./apps/desktop/package.json').version")"
          if [[ "$tag_version" != "$pkg_version" ]]; then
            echo "Tag v$tag_version does not match apps/desktop/package.json version $pkg_version." >&2
            echo "Bump the version in a release commit, then re-tag." >&2
            exit 1
          fi

      - name: Resolve the installed electron version
        id: electron-version
        run: node -e "
          const fs = require('fs');
          let version = null;
          for (const base of ['', 'apps/desktop/', 'apps/desktop/../']) {
            try {
              version = require(base + 'node_modules/electron/package.json').version;
              console.log('electron resolved at ' + base + 'node_modules/electron -> ' + version);
              break;
            } catch (err) {
              if (err.code !== 'ENOENT' && err.code !== 'MODULE_NOT_FOUND') throw err;
            }
          }
          if (!version) throw new Error('electron/package.json not found in any known location — cannot pin electronVersion');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'version=' + version + '\n');
          "

      - name: Build, publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm --dir apps/desktop run release:win -- "-c.electronVersion=${{ steps.electron-version.outputs.version }}"
